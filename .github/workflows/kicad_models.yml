name: Generate KiCAD Models

on:
  push:
    paths:
      - 'ihp-sg13g2/libs.ref/sg13g2_stdcell/spice/sg13g2_stdcell.spice'
      - 'ihp-sg13g2/libs.tech/kicad/**'
  pull_request:
    paths:
      - 'ihp-sg13g2/libs.ref/sg13g2_stdcell/spice/sg13g2_stdcell.spice'
      - 'ihp-sg13g2/libs.tech/kicad/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate KiCAD Models
        run: |
          python3 ihp-sg13g2/libs.tech/kicad/scripts/spice_to_kicad.py

      - name: Archive KiCAD Models
        uses: actions/upload-artifact@v3
        with:
          name: kicad-models
          path: ihp-sg13g2/libs.ref/sg13g2_stdcell/kicad/
